  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Fredoka', cursive, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .card-flip {
      perspective: 1000px;
    }
    .card-inner {
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
      /* Never intercept clicks: on some displays/browsers the 3D flip isn't
         rendered perfectly and this face can visually sit on top of
         card-front, silently swallowing taps meant to open the question. */
      pointer-events: none;
    }
    .bounce-in {
      animation: bounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.05); opacity: 1; }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
  </style>
</head>

      { id: 8, type: 'mcq', points: 15, question: "What unique hardware identification number is permanently burned into a Network Interface Card (NIC)?", options: {A:"IP Address", B:"PIN Code", C:"MAC Address", D:"URL Address"}, answer: "C" },
      { id: 9, type: 'mcq', points: 15, question: "Why is a network Hub referred to as a 'dumb' device?", options: {A:"It cannot be turned on or off", B:"It broadcasts incoming messages to all connected computers", C:"It requires an internet connection to function", D:"It deletes incoming data packets"}, answer: "B" },

      { id: 16, type: 'mcq', points: 10, question: "What set of protocols governs the transmission of data across the Internet?", options: {A:"HTTP / HTML", B:"TCP / IP", C:"FTP / POP3", D:"SSL / TLS"}, answer: "B" },

      { id: 18, type: 'mcq', points: 20, question: "What is an Extranet?", options: {A:"An internal network that has no security password", B:"A network used exclusively for audio conferencing", C:"An extension of an intranet that allows limited access to authorized external users", D:"A satellite network used in deep ocean research"}, answer: "C" },
      { id: 19, type: 'mcq', points: 15, question: "Which of the following is an advantage of Cloud Storage for a business?", options: {A:"Files can be accessed from anywhere with an internet connection", B:"It eliminates the need for an internet connection", C:"Data is completely immune to cyberattacks", D:"Users have 100% control over the physical server hardware"}, answer: "A" },

      { id: 21, type: 'mcq', points: 20, question: "What type of encryption uses two different keys (a Public Key and a Private Key)?", options: {A:"Symmetric Encryption", B:"Asymmetric Encryption", C:"Caesar Cipher", D:"Hash Function"}, answer: "B" },

      { id: 67, type: 'short', points: 20, question: "Scenario: The hospital portal now allows authorized patients to log in from home to book appointments. What network environment is this?", answer: "Extranet" },
      { id: 68, type: 'short', points: 20, question: "Scenario: Internet goes down, and designers cannot access Google Drive files. What major disadvantage of cloud storage does this highlight?", answer: "Cloud storage requires an active internet connection to access files." },
      { id: 69, type: 'short', points: 20, question: "Scenario: An attacker intercepts data packets on public Wi-Fi without altering data. What type of attack is this?", answer: "Passive attack" },
      { id: 70, type: 'short', points: 15, question: "Scenario: A system inspects incoming IP addresses and blocks untrusted connection attempts. What security mechanism did this?", answer: "Firewall" },
      { id: 71, type: 'short', points: 20, question: "Scenario: Alice wants to send an encrypted document to Bob. Which of Bob's keys should Alice use to encrypt?", answer: "Bob's Public Key" },
      { id: 72, type: 'short', points: 20, question: "Scenario: Bob receives the encrypted document from Alice. Which key must Bob use to decrypt?", answer: "Bob's Private Key" },
      { id: 73, type: 'short', points: 20, question: "Scenario: Student A uses password 'rover2015'. Why is it weak?", answer: "Uses pet name, birth year, no uppercase, no special symbols." },
      { id: 74, type: 'short', points: 15, question: "Scenario: A bank customer inserts a microchip plastic card into an ATM. What type of card is this?", answer: "Smart card (Contact smart card)" },
      { id: 75, type: 'short', points: 15, question: "Scenario: Bank sends a 6-digit OTP code to a smartphone/key fob device. What authentication device is used?", answer: "Physical token / Electronic token / OTP device" },
      { id: 76, type: 'short', points: 20, question: "Scenario: User downloads a free game installer. Files are deleted in the background. What malware was disguised inside?", answer: "Trojan horse" },
      { id: 77, type: 'short', points: 20, question: "Scenario: 50 computers on a school network get infected automatically without clicking any links. What self-replicating malware caused this?", answer: "Worm" },
      { id: 78, type: 'short', points: 15, question: "Scenario: Unwanted shopping pop-ups constantly appear when opening a browser. What malware is this?", answer: "Adware" },
      { id: 79, type: 'short', points: 20, question: "Scenario: Executives meet in dedicated rooms with large screens, room cameras, and private lines. Is this Video-conferencing or Web-conferencing?", answer: "Video-conferencing" },
      { id: 80, type: 'short', points: 15, question: "Scenario: Lecturer hosts live teaching over the internet with 100 students viewing slides and chat box. What specific session is this?", answer: "Webinar" }
    ];

    // Power-Up / Trap definitions
    const POWER_UPS = [
      { id: 'bomb', name: 'BOM MELEDAK!', desc: 'Tim kamu kehilangan 25 poin!', effect: (score) => score - 25, color: 'from-red-600 to-rose-700', icon: '💣' },
      { id: 'double', name: 'POIN GANDA!', desc: 'Dapatkan Bonus +30 Poin!', effect: (score) => score + 30, color: 'from-amber-500 to-yellow-600', icon: '⭐' },
      { id: 'swap', name: 'TUKAR SKOR!', desc: 'Tukar skor dengan tim di posisi teratas!', effect: null, isSwap: true, color: 'from-purple-600 to-indigo-700', icon: '🔄' },
      { id: 'thief', name: 'CURI POIN!', desc: 'Curi 20 poin dari tim pemimpin!', effect: null, isSteal20: true, color: 'from-emerald-600 to-teal-700', icon: '🥷' },
      { id: 'jackpot', name: 'JACKPOT!', desc: 'Dapatkan Bonus +50 Poin!', effect: (score) => score + 50, color: 'from-pink-500 to-rose-600', icon: '🎰' }
    ];

    const TEAM_COLORS = [
      { name: 'Merah', bg: 'bg-red-500', border: 'border-red-400', text: 'text-red-400', hex: '#ef4444' },
      { name: 'Biru', bg: 'bg-blue-500', border: 'border-blue-400', text: 'text-blue-400', hex: '#3b82f6' },
      { name: 'Hijau', bg: 'bg-emerald-500', border: 'border-emerald-400', text: 'text-emerald-400', hex: '#10b981' },
      { name: 'Kuning', bg: 'bg-amber-500', border: 'border-amber-400', text: 'text-amber-400', hex: '#f59e0b' },
      { name: 'Ungu', bg: 'bg-purple-500', border: 'border-purple-400', text: 'text-purple-400', hex: '#a855f7' },
      { name: 'Pink', bg: 'bg-pink-500', border: 'border-pink-400', text: 'text-pink-400', hex: '#ec4899' }
    ];

    function App() {
      // Configuration & Setup States
      const [gameState, setGameState] = useState('setup'); // 'setup', 'playing', 'gameover'
      const [gridSize, setGridSize] = useState(16); // 9, 12, 16, 20, 24, 30, 40
      const [stealMode, setStealMode] = useState('auto'); // 'auto', 'random', 'manual', 'open'
      const [currentEffectiveMode, setCurrentEffectiveMode] = useState('random');
      const [powerUpRate, setPowerUpRate] = useState(20); // percentage
      const [questionTimerDuration, setQuestionTimerDuration] = useState(20); // seconds, 0 = off

      // Live Countdown Timer State
      const [timeLeft, setTimeLeft] = useState(null);

      // Team States
      const [teams, setTeams] = useState([
        { id: 1, name: 'Tim 1', score: 0, color: TEAM_COLORS[0] },
        { id: 2, name: 'Tim 2', score: 0, color: TEAM_COLORS[1] },
        { id: 3, name: 'Tim 3', score: 0, color: TEAM_COLORS[2] }
      ]);
      const [activeTeamIdx, setActiveTeamIdx] = useState(0);

      // Game Tiles State
      const [tiles, setTiles] = useState([]);
      const [selectedTile, setSelectedTile] = useState(null);
      const [revealedAnswer, setRevealedAnswer] = useState(false);

      // Enhanced Steal Mechanics State
      const [stealPhase, setStealPhase] = useState('none'); // 'none', 'selecting_team', 'animating_random', 'stealing_answer'
      const [stealingTeamId, setStealingTeamId] = useState(null);
      const [animatingTeamId, setAnimatingTeamId] = useState(null);
      const [isSpinFinished, setIsSpinFinished] = useState(false);

      // Host Manual Score Adjustment Modal
      const [manualScoreModal, setManualScoreModal] = useState(false);

      // Custom Question Editor Modal
      const [questionBank, setQuestionBank] = useState(RAW_QUESTIONS);
      const [editorModal, setEditorModal] = useState(false);

      // --- ADMIN PANEL SYNC (BroadcastChannel: lets a separate admin.html tab
      // on the SAME browser/device see the current question + answer, without
      // exposing it on the projected screen) ---
      const adminChannelRef = useRef(null);
      const liveStateRef = useRef(null);

      useEffect(() => {
        liveStateRef.current = {
          gameState, teams, activeTeamIdx, selectedTile,
          stealPhase, stealingTeamId, currentEffectiveMode, timeLeft
        };
      });

      useEffect(() => {
        if (typeof BroadcastChannel === 'undefined') return;
        const channel = new BroadcastChannel('baamboozle_admin_sync');
        adminChannelRef.current = channel;
        channel.onmessage = (e) => {
          if (e.data === 'request_state' && liveStateRef.current) {
            channel.postMessage({ type: 'state', ...liveStateRef.current });
          }
        };
        return () => channel.close();
      }, []);

      useEffect(() => {
        if (adminChannelRef.current) {
          adminChannelRef.current.postMessage({
            type: 'state', gameState, teams, activeTeamIdx, selectedTile,
            stealPhase, stealingTeamId, currentEffectiveMode, timeLeft
          });
        }
      }, [gameState, teams, activeTeamIdx, selectedTile, stealPhase, stealingTeamId, currentEffectiveMode, timeLeft]);

      // Initialize Lucide Icons
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Live Countdown Timer: ticks down whenever a question (not power-up) is
      // on screen and stops once it hits 0. Host still decides correct/wrong
      // manually — this is a pacing aid, not an auto-judge.
      useEffect(() => {
        if (timeLeft === null || timeLeft <= 0) return;
        const t = setTimeout(() => setTimeLeft(prev => (prev === null ? null : prev - 1)), 1000);
        return () => clearTimeout(t);
      }, [timeLeft]);

      // --- GAME SETUP & INITIALIZATION ---
      const handleStartGame = () => {
        // Shuffle and pick questions/powerups according to grid size
        const shuffledQ = [...questionBank].sort(() => 0.5 - Math.random());
        const totalPowerUps = Math.floor((gridSize * powerUpRate) / 100);
        const totalQuestions = gridSize - totalPowerUps;

        const selectedQ = shuffledQ.slice(0, totalQuestions);
        const generatedTiles = [];

        // Mix Questions and Powerups
        for (let i = 0; i < totalQuestions; i++) {
          generatedTiles.push({
            id: i + 1,
            tileNumber: i + 1,
            isPowerUp: false,
            data: selectedQ[i],
            isOpened: false
          });
        }

        for (let i = 0; i < totalPowerUps; i++) {
          const randomPU = POWER_UPS[Math.floor(Math.random() * POWER_UPS.length)];
          generatedTiles.push({
            id: totalQuestions + i + 1,
            tileNumber: totalQuestions + i + 1,
            isPowerUp: true,
            data: randomPU,
            isOpened: false
          });
        }

        // Shuffle tile order
        const finalGrid = generatedTiles.sort(() => 0.5 - Math.random()).map((t, idx) => ({
          ...t,
          tileNumber: idx + 1
        }));

        setTiles(finalGrid);
        setActiveTeamIdx(0);
        setGameState('playing');
      };

      // Turn Management
      const nextTurn = () => {
        setActiveTeamIdx((prev) => (prev + 1) % teams.length);
        setSelectedTile(null);
        setRevealedAnswer(false);
        setStealPhase('none');
        setStealingTeamId(null);
        setAnimatingTeamId(null);
        setIsSpinFinished(false);
        setCurrentEffectiveMode('random');
        setTimeLeft(null);

        // Check game over
        const remaining = tiles.filter(t => !t.isOpened).length;
        if (remaining <= 1) { // 1 remaining means current tile is the last one
          setTimeout(() => {
            setGameState('gameover');
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
          }, 1000);
        }
      };

      // Tile Click Handler
      const handleTileClick = (tile) => {
        if (tile.isOpened) return;

        // Mark tile as opened
        setTiles(prev => prev.map(t => t.id === tile.id ? { ...t, isOpened: true } : t));
        setSelectedTile(tile);

        // If it's a Power Up / Trap, execute immediately
        if (tile.isPowerUp) {
          executePowerUp(tile.data);
          setTimeLeft(null);
        } else {
          setTimeLeft(questionTimerDuration > 0 ? questionTimerDuration : null);
        }
      };

      // Execute Power-Up Effect
      const executePowerUp = (pu) => {
        setTeams(prev => {
          const currentTeam = prev[activeTeamIdx];
          const newTeams = [...prev];

          if (pu.isSwap) {
            // Find top team (other than current)
            const otherTeams = newTeams.filter(t => t.id !== currentTeam.id);
            const topTeam = otherTeams.reduce((max, t) => t.score > max.score ? t : max, otherTeams[0]);
            if (topTeam) {
              const tempScore = currentTeam.score;
              currentTeam.score = topTeam.score;
              topTeam.score = tempScore;
            }
          } else if (pu.isSteal20) {
            const otherTeams = newTeams.filter(t => t.id !== currentTeam.id);
            const topTeam = otherTeams.reduce((max, t) => t.score > max.score ? t : max, otherTeams[0]);
            if (topTeam && topTeam.score >= 20) {
              topTeam.score -= 20;
              currentTeam.score += 20;
            }
          } else if (pu.effect) {
            currentTeam.score = pu.effect(currentTeam.score);
          }

          return newTeams;
        });
      };

      // Handle Active Team Correct Answer
      const handleCorrectAnswer = () => {
        const points = selectedTile.data.points || 10;
        setTeams(prev => prev.map((t, idx) => idx === activeTeamIdx ? { ...t, score: t.score + points } : t));
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        nextTurn();
      };

      const startRandomPickerAnimation = (eligibleTeams) => {
        setIsSpinFinished(false);
        let currentIndex = 0;
        let speed = 70; // initial interval in ms
        let counter = 0;
        const totalSteps = 22 + Math.floor(Math.random() * 8);

        const finalChosenTeam = eligibleTeams[Math.floor(Math.random() * eligibleTeams.length)];

        const spin = () => {
          counter++;
          currentIndex = (currentIndex + 1) % eligibleTeams.length;
          setAnimatingTeamId(eligibleTeams[currentIndex].id);

          if (counter < totalSteps) {
            // Gradually slow down near the finish
            if (counter > totalSteps - 6) {
              speed += 70;
            } else if (counter > totalSteps - 12) {
              speed += 35;
            }
            setTimeout(spin, speed);
          } else {
            // Land on chosen team
            setAnimatingTeamId(finalChosenTeam.id);
            setStealingTeamId(finalChosenTeam.id);
            setIsSpinFinished(true);

            // Micro confetti burst on selection
            confetti({ particleCount: 30, spread: 50, origin: { y: 0.5 } });

            // Transition to answer steal step after brief reveal
            setTimeout(() => {
              setStealPhase('stealing_answer');
              setTimeLeft(questionTimerDuration > 0 ? questionTimerDuration : null);
            }, 1300);
          }
        };

        spin();
      };

      // Handle Active Team Wrong Answer -> Deduct Points & Trigger Steal Mechanics!
      const handleWrongAnswer = () => {
        const points = selectedTile.data.points || 10;

        setTeams(prev => prev.map((t, idx) =>
          idx === activeTeamIdx ? { ...t, score: t.score - points } : t
        ));

        // No stealing when: only 1 team, question type is True/False (too easy to
        // guess 50/50 without answering), or the answer key has already been
        // revealed on screen (would no longer be a fair steal).
        if (teams.length <= 1 || selectedTile.data.type === 'tf' || revealedAnswer) {
          nextTurn();
          return;
        }

        const eligibleTeams = teams.filter((_, idx) => idx !== activeTeamIdx);

        // Determine effective steal mode (if 'auto', system dynamically picks one)
        let effectiveMode = stealMode;
        if (stealMode === 'auto') {
          const modes = ['random', 'manual', 'open'];
          effectiveMode = modes[Math.floor(Math.random() * modes.length)];
        }
        setCurrentEffectiveMode(effectiveMode);

        if (effectiveMode === 'random') {
          setStealPhase('animating_random');
          startRandomPickerAnimation(eligibleTeams);
        } else if (effectiveMode === 'manual' || effectiveMode === 'open') {
          setStealPhase('selecting_team');
        }
      };

      // Handle Steal Answer Outcome
      const handleStealOutcome = (isStealCorrect) => {
        const points = selectedTile.data.points || 10;
        const targetTeamIdx = teams.findIndex(t => t.id === stealingTeamId);

        if (targetTeamIdx !== -1) {
          setTeams(prev => prev.map((t, idx) => {
            if (idx === targetTeamIdx) {
              return {
                ...t,
                score: isStealCorrect ? t.score + points : t.score - Math.floor(points / 2)
              };
            }
            return t;
          }));

          if (isStealCorrect) {
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
          }
        }
        nextTurn();
      };

      // Helper for Team Management
      const addTeam = () => {
        if (teams.length >= 6) return;
        const nextId = teams.length + 1;
        const color = TEAM_COLORS[teams.length % TEAM_COLORS.length];
        setTeams([...teams, { id: Date.now(), name: `Tim ${nextId}`, score: 0, color }]);
      };

      const removeTeam = (id) => {
        if (teams.length <= 2) return;
        setTeams(teams.filter(t => t.id !== id));
      };

      const updateTeamName = (id, newName) => {
        setTeams(teams.map(t => t.id === id ? { ...t, name: newName } : t));
      };

      const adjustScore = (teamId, amount) => {
        setTeams(teams.map(t => t.id === teamId ? { ...t, score: t.score + amount } : t));

              <div className="bg-amber-400 text-indigo-950 p-2 rounded-xl font-black text-2xl shadow-lg">⚡</div>
              <div>
                <h1 className="text-2xl font-bold tracking-wide bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 bg-clip-text text-transparent">
                  Baamboozle <span className="text-indigo-400 font-normal text-lg">Enhanced</span>
                </h1>
                <p className="text-xs text-indigo-300">Interactive Classroom Game App</p>
              </div>
            </div>

            <div className="flex items-center space-x-3">
              <button

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">

                          <div className={`w-4 h-8 rounded-md ${team.color.bg}`}></div>
                          <input 
                            type="text"

                              ✕
                            </button>

                    </div>
                  </div>

                  {/* Start Button */}
                  <button

                    className="w-full bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500 text-indigo-950 font-black text-xl py-4 rounded-2xl shadow-xl hover:brightness-110 active:scale-95 transition transform"
                  >
                    🚀 MULAI PERMAINAN
                  </button>
                </div>
              </div>

            {/* --- SCREEN 2: GAMEPLAY BOARD --- */}
            {gameState === 'playing' && (
              <div className="flex flex-col space-y-6">

                {/* Scoreboard Bar */}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">

                    return (
                      <div

                        className={`p-3 rounded-2xl border transition-all duration-300 relative overflow-hidden ${

                            : 'bg-indigo-950/60 border-indigo-800 opacity-80'
                        }`}
                      >
                        {isActive && (
                          <div className="absolute top-0 right-0 bg-amber-400 text-indigo-950 text-[10px] font-black px-2 py-0.5 rounded-bl-lg">
                            GILIRAN
                          </div>
                        )}
                        <div className="flex items-center space-x-2">
                          <div className={`w-3 h-3 rounded-full ${team.color.bg}`}></div>
                          <span className="font-bold text-sm truncate text-white">{team.name}</span>
                        </div>
                        <div className="text-2xl font-black mt-1 text-amber-300">{team.score} <span className="text-xs font-normal text-indigo-300">pts</span></div>
                      </div>
                    );
                  })}
                </div>

                {/* Active Turn Banner */}
                <div className="bg-indigo-900/80 border border-indigo-700/60 rounded-2xl p-3 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <span className="text-sm text-indigo-300">Giliran Saat Ini:</span>
                    <span className={`text-lg font-black ${teams[activeTeamIdx]?.color.text}`}>
                      {teams[activeTeamIdx]?.name}
                    </span>
                  </div>
                  <div className="text-xs text-indigo-300 bg-indigo-950 px-3 py-1 rounded-full border border-indigo-800">

                {/* Grid Board */}
                <div className={`grid gap-3 md:gap-4 ${

                  {tiles.map((tile) => (
                    <div key={tile.id} className="card-flip h-24 md:h-28">
                      <div className={`card-inner w-full h-full relative rounded-2xl cursor-pointer ${tile.isOpened ? 'flipped' : ''}`}>
                        
                        {/* FRONT OF CARD (CLOSED) */}
                        <div

                          className="card-front absolute inset-0 bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-800 rounded-2xl border-2 border-indigo-500/50 flex items-center justify-center shadow-lg hover:border-amber-400 hover:scale-105 transition transform"
                        >
                          <span className="text-2xl md:text-3xl font-black text-amber-300 drop-shadow">
                            {tile.tileNumber}
                          </span>

            {gameState === 'gameover' && (

                <div className="space-y-3 mb-8">
                  {[...teams].sort((a,b) => b.score - a.score).map((team, rank) => (
                    <div

                      className={`p-4 rounded-2xl flex justify-between items-center border ${

                <button

                >
                  Main Lagi
                </button>
              </div>
            )}

          </main>

          {/* --- MODAL: QUESTION / POWER-UP INTERACTION --- */}
          {selectedTile && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-indigo-900 border-2 border-indigo-600 rounded-3xl max-w-2xl w-full p-6 md:p-8 shadow-2xl bounce-in">
                
                {/* POWER UP TILE MODAL */}

                    <p className="text-lg text-indigo-100 max-w-md mx-auto">{selectedTile.data.desc}</p>

                        <button 
                          onClick={handleWrongAnswer}
                          className="bg-rose-600 hover:bg-rose-500 text-white font-black py-3.5 rounded-2xl shadow-lg text-lg transition flex items-center justify-center space-x-2"
                        >
                          <span>❌ Jawaban Salah (-{selectedTile.data.points || 10} Pts)</span>
                        </button>
                      </div>
                    )}

                    {/* ENHANCED STEAL PHASE: ANIMATED RANDOM PICKER */}
                    {stealPhase === 'animating_random' && (
                      <div className="bg-gradient-to-r from-purple-900/90 via-indigo-900/90 to-purple-900/90 border-2 border-amber-400 p-6 rounded-3xl text-center space-y-4 shadow-2xl bounce-in">
                        {stealMode === 'auto' && (
                          <div className="inline-block bg-amber-400 text-indigo-950 text-xs font-black px-3 py-1 rounded-full shadow border border-amber-300 mb-1 animate-pulse">
                            ⚡ OTOMATIS SISTEM: MODE RANDOM PICK!
                          </div>
                        )}
                        <div className="flex justify-center items-center space-x-2">
                          <span className={`text-3xl ${isSpinFinished ? 'animate-bounce' : 'animate-spin'}`}>
                            {isSpinFinished ? '🎯' : '🎰'}
                          </span>
                          <h4 className="text-xl font-black text-amber-300 tracking-wider uppercase">
                            {isSpinFinished ? 'TIM TERPILIH UNTUK MEREBUT:' : 'MENGACAK TIM PENERIMA LEMPARAN...'}
                          </h4>
                        </div>

                        {/* Roulette Display Box */}
                        <div className="py-4 px-6 bg-indigo-950/80 rounded-2xl border-2 border-indigo-500/50 flex justify-center items-center min-h-[90px] relative overflow-hidden">
                          {teams.map(team => {
                            const isCurrentAnimated = team.id === animatingTeamId;
                            if (!isCurrentAnimated && isSpinFinished && team.id !== stealingTeamId) return null;

                            return (
                              <div 
                                key={team.id}
                                className={`transition-all duration-150 flex items-center space-x-3 px-6 py-3 rounded-2xl border-2 ${
                                  isCurrentAnimated 
                                    ? `${team.color.bg} ${team.color.border} text-white scale-110 shadow-2xl ring-4 ring-amber-300 ${isSpinFinished ? 'animate-bounce' : 'scale-105'}` 
                                    : 'opacity-0 absolute scale-75'
                                }`}
                              >
                                <span className="text-2xl font-black">{team.name}</span>
                                {isSpinFinished && <span className="text-xl">🔥</span>}
                              </div>
                            );
                          })}
                        </div>

                        <p className="text-xs text-indigo-300 font-semibold italic">
                          {isSpinFinished ? 'Bersiaplah untuk merebut poin!' : 'Sistem sedang memilih tim lain secara acak...'}
                        </p>
                      </div>
                    )}

                    {/* ENHANCED STEAL PHASE: MANUAL PICK / SELECTION */}
                    {stealPhase === 'selecting_team' && (
                      <div className="bg-amber-500/10 border border-amber-500/40 p-4 rounded-2xl space-y-3">
                        {stealMode === 'auto' && (
                          <div className="text-center">
                            <span className="inline-block bg-amber-400 text-indigo-950 text-xs font-black px-3 py-1 rounded-full shadow border border-amber-300 animate-pulse">
                              ⚡ OTOMATIS SISTEM: {currentEffectiveMode === 'open' ? 'MODE OPEN STEAL!' : 'MODE MANUAL PICK!'}
                            </span>
                          </div>
                        )}
                        <div className="text-amber-300 font-bold text-center text-sm">
                          {currentEffectiveMode === 'open' 
                            ? '⚡ Open Steal: Pertanyaan Bebas Direbut! Pilih tim yang tercepat merebut:' 
                            : '🎯 Mode Lempar: Pilih Tim yang Akan Merebut Pertanyaan!'}
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                          {teams.filter((_, idx) => idx !== activeTeamIdx).map(team => (
                            <button
                              key={team.id}
                              onClick={() => {
                                setStealingTeamId(team.id);
                                setStealPhase('stealing_answer');
                                setTimeLeft(questionTimerDuration > 0 ? questionTimerDuration : null);
                              }}
                              className="bg-indigo-800 hover:bg-amber-400 hover:text-indigo-950 text-white border border-indigo-600 font-bold p-2.5 rounded-xl transition text-sm"
                            >
                              {team.name}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* ENHANCED STEAL PHASE: STEAL ANSWER OUTCOME */}
                    {stealPhase === 'stealing_answer' && (
                      <div className="bg-purple-950/80 border border-purple-500/50 p-4 rounded-2xl text-center space-y-3 bounce-in">
                        <div className="text-purple-300 font-extrabold text-base">
                          ⚡ Kesempatan Merebut Pertanyaan oleh: <span className="text-amber-300 underline">{teams.find(t => t.id === stealingTeamId)?.name}</span>!
                        </div>
                        <div className="grid grid-cols-2 gap-3 pt-2">
                          <button 
                            onClick={() => handleStealOutcome(true)}
                            className="bg-emerald-500 hover:bg-emerald-400 text-indigo-950 font-black py-2.5 rounded-xl shadow transition"
                          >
                            Perebutan Benar (+Points)
                          </button>
                          <button 
                            onClick={() => handleStealOutcome(false)}
                            className="bg-rose-600 hover:bg-rose-500 text-white font-black py-2.5 rounded-xl shadow transition"
                          >
                            Perebutan Salah (-Penalti)
                          </button>
                        </div>
                      </div>
                    )}

                  </div>
                )}

              </div>
            </div>
          )}

          {/* --- MODAL: HOST MANUAL SCORE ADJUSTMENT --- */}
          {manualScoreModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-indigo-900 border border-indigo-700 rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-extrabold text-amber-300">⚙️ Kontrol Host / Penyesuaian Skor</h3>
                  <button onClick={() => setManualScoreModal(false)} className="text-indigo-300 hover:text-white">✕</button>
                </div>

                <div className="space-y-3">
                  {teams.map(team => (
                    <div key={team.id} className="flex justify-between items-center bg-indigo-950 p-3 rounded-xl border border-indigo-800">
                      <span className="font-bold text-white">{team.name}: <span className="text-amber-300">{team.score} pts</span></span>
                      <div className="flex items-center space-x-2">
                        <button onClick={() => adjustScore(team.id, -10)} className="bg-rose-600 text-white px-2.5 py-1 rounded-lg font-bold text-xs hover:bg-rose-500">-10</button>
                        <button onClick={() => adjustScore(team.id, 10)} className="bg-emerald-600 text-white px-2.5 py-1 rounded-lg font-bold text-xs hover:bg-emerald-500">+10</button>
                      </div>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={() => setManualScoreModal(false)}
                  className="w-full bg-indigo-800 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl mt-5 transition"
                >
                  Selesai
                </button>
              </div>
            </div>
          )}

          {/* --- MODAL: BANK SOAL / EDITOR --- */}
          {editorModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="bg-indigo-900 border border-indigo-700 rounded-3xl max-w-3xl w-full p-6 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-extrabold text-amber-300">📚 Bank Soal Aktif ({questionBank.length} Soal)</h3>
                  <button onClick={() => setEditorModal(false)} className="text-indigo-300 hover:text-white">✕</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                  {questionBank.map((q, idx) => (
                    <div key={q.id || idx} className="bg-indigo-950 p-3 rounded-xl border border-indigo-800 text-sm">
                      <div className="flex justify-between font-bold text-amber-300 text-xs mb-1">
                        <span>#Soal {idx + 1} ({q.type.toUpperCase()})</span>
                        <span>{q.points} Pts</span>
                      </div>
                      <div className="text-white font-medium">{q.question}</div>
                      <div className="text-xs text-emerald-400 mt-1 font-semibold">Kunci: {q.answer}</div>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={() => setEditorModal(false)}
                  className="w-full bg-amber-400 hover:bg-amber-300 text-indigo-950 font-bold py-2.5 rounded-xl mt-4 transition"
                >
                  Tutup Editor
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
